<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>ФОРМА — мебель для жизни</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f3efe7;color:#29452d;font:16px Arial,sans-serif}p{margin:3rem}iframe{position:fixed;inset:0;height:100dvh;display:block}</style></head><body><p role="status">Открываем ФОРМУ…</p><script>
