<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><link rel="icon" href="data:,"><title>ФОРМА — мебель для жизни</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{background:#f3efe7;color:#29452d;font:16px Arial,sans-serif}p{margin:3rem}iframe{position:fixed;inset:0;height:100dvh;display:block}</style></head><body><p role="status">Открываем ФОРМУ…</p><script>
(async()=>{
 const fragment=location.hash.slice(1);if(!/^[a-f0-9]{64}$/.test(fragment))throw Error('key');
 const bytes=Uint8Array.from(fragment.match(/../g),v=>parseInt(v,16));const key=await crypto.subtle.importKey('raw',bytes,'AES-GCM',false,['decrypt']);
 const response=await fetch('./preview.bin?v=10a6ef7098594c05');if(!response.ok)throw Error('download');const data=new Uint8Array(await response.arrayBuffer());
 const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));const bundle=JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
 const urls={};for(const [name,file] of Object.entries(bundle.images)){const bytes=Uint8Array.from(atob(file.base64),c=>c.charCodeAt(0));urls[name]=URL.createObjectURL(new Blob([bytes],{type:file.mime}));}window.formaAssets=urls;
 window.formaNavigate=href=>{const target=new URL(href,'https://forma.local/'),url=new URL(location.href);url.search=target.search;url.searchParams.set('page',(['catalog','interiors','help'].find(name=>target.pathname.endsWith(name+'.html'))||'home'));if(target.hash)url.searchParams.set('section',target.hash.slice(1));location.href=url.href;};
 const replaceAssets=s=>s.replace(/assets\/[a-zA-Z0-9_.-]+\.(?:png|jpg|webp)/g,name=>urls[name]||name);
 const page=(['catalog','interiors','help'].includes(new URLSearchParams(location.search).get('page'))?new URLSearchParams(location.search).get('page'):'home');
 const boot="window.formaHosted=true;window.formaAssets=parent.formaAssets;window.formaSearch=parent.location.search;window.formaAdmin=new URLSearchParams(parent.location.search).get('admin')==='1';document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(a&&/^(index|catalog|interiors|help)\\.html/.test(a.getAttribute('href'))){e.preventDefault();parent.formaNavigate(a.getAttribute('href'));}});";
 const scriptCode=boot+'\n'+replaceAssets(bundle.products)+'\n'+replaceAssets(bundle.app);
 let html=replaceAssets(bundle.pages[page]);html=html.replace('</head>',()=>'<style>'+replaceAssets(bundle.css)+'</style></head>');
 html=html.replace('</body>',()=>'<script>'+scriptCode.replace(/<\/script/gi,'<\\/script')+'<'+ '/script></body>');
 const frame=document.createElement('iframe');frame.name='forma-preview';frame.title='ФОРМА — мебельный магазин';frame.src=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));frame.onload=()=>{const section=new URLSearchParams(location.search).get('section');if(section)frame.contentDocument.getElementById(section)?.scrollIntoView();};document.body.replaceChildren(frame);
})().catch(()=>{document.querySelector('p').textContent='Для просмотра откройте полную ссылку из приватного репозитория ФОРМА.'});
</script></body></html>
