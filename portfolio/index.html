<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>Портфолио</title><body style="background:#111411;color:white;font:16px system-ui"><p role="status">Открываем портфолио…</p><script>async function openSite(){const k=new URLSearchParams(location.search).get("v");if(!/^[a-f0-9]{64}$/.test(k))throw Error();const key=await crypto.subtle.importKey("raw",Uint8Array.from(k.match(/../g),x=>parseInt(x,16)),"AES-GCM",false,["decrypt"]);const r=await fetch("./preview.bin");if(!r.ok)throw Error();const d=new Uint8Array(await r.arrayBuffer());const page=await crypto.subtle.decrypt({name:"AES-GCM",iv:d.slice(0,12)},key,d.slice(12));document.open();document.write(new TextDecoder().decode(page));document.close()}openSite().catch(()=>document.querySelector("p").textContent="Откройте полную ссылку на портфолио.");</script>
